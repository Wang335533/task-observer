name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r collector/requirements-build.txt
      - run: python -m pytest tests/test_collector.py tests/test_sources.py -q
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
